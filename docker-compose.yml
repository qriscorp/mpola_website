services:
  website:
    container_name: lendflow-website
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks:
      - shared_network

networks:
  shared_network:
    external: true
